<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artemis MK 1</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="brand-group">
      <a href="index.html" class="brand" data-brand>Artemis MK 1</a>
      <span class="status-pill"><span class="dot"></span>SYSTEM ONLINE</span>
    </div>
    <nav class="site-nav">
      <a href="/">Home</a>
      <!--<a href="pricing">Pricing</a>-->
      <!--<a href="calendar">Calendar</a>-->
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div class="hero-text">
      <p class="tagline" id="tagline"></p>
      <h1 id="business-name">Artemis Lawn and Leaf</h1>
      <p class="description" id="description"></p>
      <div class="cta-row">
        <!--<a class="btn primary" href="tel:" id="call-btn">Call now</a>
        <a class="btn secondary" href="pricing.html">See pricing</a>-->
      </div>
    </div>
    <div class="hero-art" id="hero-art"></div>
  </div>
</section>

<section class="product-gallery" id="seasonalGallery">
  <div class="gallery-header">
    <h2 class="gallery-title">The Collection</h2>
    <p class="gallery-subtitle">Handmade, custom-fit chest harnesses designed for every body.</p>
  </div>

  <div class="gallery-container">
    
    <!-- Harness Card 1 -->
    <div class="gallery-item">
      <!-- Status Badges positioned on top of image -->
      <div class="item-badges">
        <span class="badge badge-stock">In Stock</span>
        <span class="badge badge-type">Custom Fit</span>
      </div>
      
      <img src="harness1.jpg" alt="Custom Chest Harness" class="gallery-img">
      
      <div class="gallery-overlay">
        <h3 class="product-title">Classic Harness</h3>
        <p class="product-tag">Aura Series</p>
        <span class="product-price">$65.00</span>
        <a href="#" class="view-btn">View Details</a>
      </div>
    </div>

    <!-- Harness Card 2 -->
    <div class="gallery-item">
      <div class="item-badges">
        <span class="badge badge-limited">Limited</span>
      </div>
      
      <img src="harness2.jpg" alt="Handmade Harness" class="gallery-img">
      
      <div class="gallery-overlay">
        <h3 class="product-title">Blossom Straps</h3>
        <p class="product-tag">Seasonal Special</p>
        <span class="product-price">$85.00</span>
        <a href="#" class="view-btn">View Details</a>
      </div>
    </div>

  </div>
</section>



<footer class="site-footer">
  <div class="wrap">
    <div class="contact-block">
      <div><strong data-brand>Artemis MK 1</strong></div>
      <!--<div>Phone: <a href="tel:" data-phone></a></div>
      <div>Email: <a href="mailto:" data-email></a></div>
      <div data-address></div>
      <div data-hours></div>-->
    </div>
  </div>
</footer>

<script src="site.js"></script>
<script>
  initSite().then(({ config, season }) => {
    document.getElementById('tagline').textContent = config.business.tagline[season];
    document.getElementById('business-name').textContent = config.business.name;
    document.getElementById('description').textContent = config.business.description[season];
    document.getElementById('hero-art').innerHTML = heroArt(season);

    const callBtn = document.getElementById('call-btn');
    callBtn.href = `tel:${config.business.phone.replace(/[^\d+]/g, '')}`;

    const row = document.getElementById('service-cards');
    row.innerHTML = config.services[season].map(s => `
      <div class="service-card hud-panel">
        <h3>${s.title}</h3>
        <span class="price mono">${s.price}</span>
        <p>${s.blurb}</p>
      </div>
    `).join('');
  });
</script>

</body>
</html>
